}
const terminalEl = document.getElementById('terminal');
const inputRowEl = document.getElementById('input-row');
const inputFieldEl = document.getElementById('terminal-input');
let pendingInput = null;
inputFieldEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && pendingInput) { const v = inputFieldEl.value; terminalEl.textContent += v + '\n'; terminalEl.scrollTop = terminalEl.scrollHeight; inputRowEl.classList.remove('active'); const p = pendingInput; pendingInput = null; p.resolve(v); } });
async function runCode() {
  const code = document.getElementById('code').value;
  terminalEl.textContent = ''; inputRowEl.classList.remove('active');
  if (!code.trim()) { terminalEl.textContent = 'Пустой код.'; return; }
  const outputFn = (l) => { terminalEl.textContent += l + '\n'; terminalEl.scrollTop = terminalEl.scrollHeight; };
  const inputFn = (p) => new Promise((resolve) => { if (p) { terminalEl.textContent += p; terminalEl.scrollTop = terminalEl.scrollHeight; } inputRowEl.classList.add('active'); inputFieldEl.value = ''; inputFieldEl.focus(); pendingInput = { resolve }; });
  try { const tk = new Lexer(code).tokenize(); const pr = new Parser(tk).parse(); const it = new Interpreter(outputFn, inputFn); await it.run(pr); } catch (e) { if (e instanceof ProlanwoError) terminalEl.textContent += '❌ ' + e.message + '\n'; else terminalEl.textContent += '❌ ' + e.message + '\n'; terminalEl.scrollTop = terminalEl.scrollHeight; } finally { inputRowEl.classList.remove('active'); }
}
function clearOutput() { terminalEl.textContent = ''; inputRowEl.classList.remove('active'); }
function loadExample() {
  const ex = [
`\\"Привет"/
variable line[name]_input("Имя: ");
briout("Привет, " + name + "!");`,
`\\"Цикл"/
variable number[i]_0;
replay (i < 5) begin {
    briout("i = " + i);
    change variable[i]_i + 1;
}`,
`\\"Функция"/
function Add(number[a], number[b]) =(
    return a + b;
)
briout(Add(3, 4));`,
`\\"Массив"/
array[names] [
    "Гордей";
    "Пётр";
]
briout(array[names][0]);`,
`\\"Рандом"/
import *random:random[object]*;
variable number[x]_random.number[1, 6];
briout("Кубик: " + x);`,
`\\"Запись в массив"/
array[nums] [ 10; 20; 30; ]
change variable[nums][0]_100;
briout(array[nums]);`
  ];

}
const codeEl = document.getElementById('code');
const lineNumbersEl = document.getElementById('line-numbers');
function updateLineNumbers() { const c = codeEl.value.split('\n').length; let s = ''; for (let i = 1; i <= c; i++) s += i + (i < c ? '\n' : ''); lineNumbersEl.textContent = s; lineNumbersEl.scrollTop = codeEl.scrollTop; }
codeEl.addEventListener('input', updateLineNumbers);
codeEl.addEventListener('scroll', () => { lineNumbersEl.scrollTop = codeEl.scrollTop; });
updateLineNumbers();
